name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # ── Job 1: Lint & Build all services ──────────────────────────────────────
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Cache npm dependencies (Web Gateway)
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-web-gateway-${{ hashFiles('**/package-lock.json') }}
          restore-keys: ${{ runner.os }}-web-gateway-

      - name: Install dependencies (Web Gateway)
        run: npm ci

      - name: Lint (Web Gateway)
        run: npm run lint
        continue-on-error: true

      - name: Cache npm dependencies (Intelligence API)
        uses: actions/cache@v4
        with:
          path: services/intelligence-api/node_modules
          key: ${{ runner.os }}-intelligence-api-${{ hashFiles('services/intelligence-api/package-lock.json') }}
          restore-keys: ${{ runner.os }}-intelligence-api-

      - name: Install dependencies (Intelligence API)
        run: cd services/intelligence-api && npm ci

      - name: Build (Intelligence API)
        run: cd services/intelligence-api && npm run build

      - name: Cache npm dependencies (News API)
        uses: actions/cache@v4
        with:
          path: services/news-api/node_modules
          key: ${{ runner.os }}-news-api-${{ hashFiles('services/news-api/package-lock.json') }}
          restore-keys: ${{ runner.os }}-news-api-

      - name: Install dependencies (News API)
        run: cd services/news-api && npm ci

      - name: Build (News API)
        run: cd services/news-api && npm run build

  # ── Job 2: SonarCloud Code Quality Scan ───────────────────────────────────
  sonarcloud-scan:
    runs-on: ubuntu-latest
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: SonarCloud Scan
        if: ${{ env.SONAR_TOKEN != '' }}
        uses: SonarSource/sonarqube-scan-action@v5
        continue-on-error: true

  # ── Job 3: Build & Push Docker Images ─────────────────────────────────────
  build-images:
    runs-on: ubuntu-latest
    needs: [lint-and-test]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop')
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Web Gateway image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile.web-gateway
          push: true
          tags: |
            ghcr.io/madhav-09/et-pulse-web-gateway:latest
            ghcr.io/madhav-09/et-pulse-web-gateway:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push Intelligence API image
        uses: docker/build-push-action@v5
        with:
          context: ./services/intelligence-api
          file: ./services/intelligence-api/Dockerfile
          push: true
          tags: |
            ghcr.io/madhav-09/et-pulse-intelligence-api:latest
            ghcr.io/madhav-09/et-pulse-intelligence-api:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push News API image
        uses: docker/build-push-action@v5
        with:
          context: ./services/news-api
          file: ./services/news-api/Dockerfile
          push: true
          tags: |
            ghcr.io/madhav-09/et-pulse-news-api:latest
            ghcr.io/madhav-09/et-pulse-news-api:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ── Job 4: Trivy Security Scan ────────────────────────────────────────────
  trivy-scan:
    runs-on: ubuntu-latest
    needs: [build-images]
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Run Trivy vulnerability scanner on Web Gateway
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ghcr.io/madhav-09/et-pulse-web-gateway:${{ github.sha }}
          format: "sarif"
          output: "trivy-web-results.sarif"
          severity: "HIGH,CRITICAL"

      - name: Run Trivy vulnerability scanner on Intelligence API
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ghcr.io/madhav-09/et-pulse-intelligence-api:${{ github.sha }}
          format: "sarif"
          output: "trivy-intelligence-results.sarif"
          severity: "HIGH,CRITICAL"

      - name: Run Trivy vulnerability scanner on News API
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ghcr.io/madhav-09/et-pulse-news-api:${{ github.sha }}
          format: "sarif"
          output: "trivy-news-results.sarif"
          severity: "HIGH,CRITICAL"

  # ── Job 5: Deploy to EC2 ──────────────────────────────────────────────────
  deploy-to-ec2:
    runs-on: ubuntu-latest
    needs: [trivy-scan]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          printf '%s' "$EC2_SSH_KEY" | tr -d '\r' > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          CLEAN_HOST=$(printf '%s' "$EC2_HOST" | tr -d '\r\n\t ' )
          ssh-keyscan -H "$CLEAN_HOST" >> ~/.ssh/known_hosts 2>/dev/null
          echo "$CLEAN_HOST" > ~/.ssh/ec2_host
        env:
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
          EC2_HOST: ${{ secrets.EC2_HOST }}

      - name: Deploy via SSH
        run: |
          CLEAN_HOST=$(cat ~/.ssh/ec2_host)
          CLEAN_USER=$(printf '%s' "$EC2_USER" | tr -d '\r\n\t ')
          ssh -i ~/.ssh/deploy_key \
            -o StrictHostKeyChecking=no \
            -o ConnectTimeout=30 \
            "${CLEAN_USER}@${CLEAN_HOST}" \
            'set -e
             cd ~/et-pulse
             git pull origin main
             docker-compose down --remove-orphans 2>/dev/null || true
             docker-compose up -d --build --force-recreate
             echo "Deployment completed successfully"'
        env:
          EC2_USER: ${{ secrets.EC2_USER }}
