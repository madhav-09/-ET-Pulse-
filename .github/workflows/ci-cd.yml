name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Cache npm dependencies (Web Gateway)
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-web-gateway-${{ hashFiles('**/package-lock.json') }}
          restore-keys: ${{ runner.os }}-web-gateway-

      - name: Install dependencies (Web Gateway)
        run: npm ci

      - name: Lint (Web Gateway)
        run: npm run lint
        continue-on-error: true

      - name: Cache npm dependencies (Intelligence API)
        uses: actions/cache@v4
        with:
          path: services/intelligence-api/node_modules
          key: ${{ runner.os }}-intelligence-api-${{ hashFiles('services/intelligence-api/package-lock.json') }}
          restore-keys: ${{ runner.os }}-intelligence-api-

      - name: Install dependencies (Intelligence API)
        run: cd services/intelligence-api && npm ci

      - name: Build (Intelligence API)
        run: cd services/intelligence-api && npm run build

      - name: Cache npm dependencies (News API)
        uses: actions/cache@v4
        with:
          path: services/news-api/node_modules
          key: ${{ runner.os }}-news-api-${{ hashFiles('services/news-api/package-lock.json') }}
          restore-keys: ${{ runner.os }}-news-api-

      - name: Install dependencies (News API)
        run: cd services/news-api && npm ci

      - name: Build (News API)
        run: cd services/news-api && npm run build

  sonarcloud-scan:
    runs-on: ubuntu-latest
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: SonarCloud Scan
        if: ${{ env.SONAR_TOKEN != '' }}
        uses: SonarSource/sonarqube-scan-action@v5
        continue-on-error: true

  build-images:
    runs-on: ubuntu-latest
    needs: [lint-and-test]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop')
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Web Gateway image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile.web-gateway
          push: true
          tags: |
            ghcr.io/madhav-09/et-pulse-web-gateway:latest
            ghcr.io/madhav-09/et-pulse-web-gateway:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push Intelligence API image
        uses: docker/build-push-action@v5
        with:
          context: ./services/intelligence-api
          file: ./services/intelligence-api/Dockerfile
          push: true
          tags: |
            ghcr.io/madhav-09/et-pulse-intelligence-api:latest
            ghcr.io/madhav-09/et-pulse-intelligence-api:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push News API image
        uses: docker/build-push-action@v5
        with:
          context: ./services/news-api
          file: ./services/news-api/Dockerfile
          push: true
          tags: |
            ghcr.io/madhav-09/et-pulse-news-api:latest
            ghcr.io/madhav-09/et-pulse-news-api:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  trivy-scan:
    runs-on: ubuntu-latest
    needs: [build-images]
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Run Trivy vulnerability scanner on Web Gateway
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ghcr.io/madhav-09/et-pulse-web-gateway:${{ github.sha }}
          severity: "HIGH,CRITICAL"

      - name: Run Trivy vulnerability scanner on Intelligence API
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ghcr.io/madhav-09/et-pulse-intelligence-api:${{ github.sha }}
          severity: "HIGH,CRITICAL"

      - name: Run Trivy vulnerability scanner on News API
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ghcr.io/madhav-09/et-pulse-news-api:${{ github.sha }}
          severity: "HIGH,CRITICAL"

  deploy-to-ec2:
    runs-on: ubuntu-latest
    needs: [trivy-scan]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && secrets.EC2_HOST != '' && secrets.EC2_USER != '' && secrets.EC2_SSH_KEY != ''
    steps:
      - uses: actions/checkout@v4

      - name: Deploy to EC2
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e

            BASE_DIR="/home/${{ secrets.EC2_USER }}"
            APP_DIR_LIVE="$BASE_DIR/et-pulse-live"
            APP_DIR_MAIN="$BASE_DIR/et-pulse"
            REPO_URL="https://github.com/${{ github.repository }}.git"

            APP_DIR=""
            if [ -d "$APP_DIR_LIVE/.git" ]; then
              APP_DIR="$APP_DIR_LIVE"
            elif [ -d "$APP_DIR_MAIN/.git" ]; then
              APP_DIR="$APP_DIR_MAIN"
            elif [ -d "$APP_DIR_LIVE" ]; then
              APP_DIR="$APP_DIR_LIVE"
            elif [ -d "$APP_DIR_MAIN" ]; then
              APP_DIR="$APP_DIR_MAIN"
            else
              echo "No deploy directory found. Cloning into $APP_DIR_MAIN"
              git clone "$REPO_URL" "$APP_DIR_MAIN"
              APP_DIR="$APP_DIR_MAIN"
            fi

            cd "$APP_DIR"

            if [ ! -d ".git" ]; then
              echo "Directory exists but is not a git repo. Re-cloning into $APP_DIR"
              cd "$BASE_DIR"
              rm -rf "$APP_DIR"
              git clone "$REPO_URL" "$APP_DIR"
              cd "$APP_DIR"
            fi

            git fetch origin main
            git checkout main || git checkout -b main
            git reset --hard origin/main

            sudo docker system prune -f || true
            if command -v docker-compose >/dev/null 2>&1; then
              sudo docker-compose down || true
              sudo docker-compose up -d --build
            else
              sudo docker compose down || true
              sudo docker compose up -d --build
            fi
            echo "Deployment completed successfully"