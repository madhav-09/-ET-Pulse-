name: ET Pulse CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Job 1: Lint ────────────────────────────────────────────────────────────
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

  # ── Job 2: Type Check ──────────────────────────────────────────────────────
  typecheck:
    name: Type Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run TypeScript compiler
        run: npx tsc --noEmit

  # ── Job 3: Build ───────────────────────────────────────────────────────────
  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [lint, typecheck]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Next.js app
        run: npm run build
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          NEWS_API_KEY: ${{ secrets.NEWS_API_KEY }}

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: nextjs-build
          path: .next/
          retention-days: 1

  # ── Job 4: Deploy ──────────────────────────────────────────────────────────
  deploy:
    name: Deploy to EC2
    runs-on: ubuntu-latest
    needs: [build]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment:
      name: production
      url: http://${{ secrets.EC2_HOST }}:3000
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Validate deploy secrets
        run: |
          test -n "${{ secrets.EC2_HOST }}"    || (echo "❌ EC2_HOST secret missing"    && exit 1)
          test -n "${{ secrets.EC2_USER }}"    || (echo "❌ EC2_USER secret missing"    && exit 1)
          test -n "${{ secrets.EC2_SSH_KEY }}" || (echo "❌ EC2_SSH_KEY secret missing" && exit 1)
          echo "✅ All deploy secrets present"

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: ${{ secrets.EC2_PORT || 22 }}
          script: |
            set -e
            APP_DIR="/home/$USER/et-pulse"
            cd "$APP_DIR"

            [ -f .env.local ] || (echo "❌ .env.local missing on server" && exit 1)

            git fetch origin main
            git checkout main
            git pull --ff-only origin main

            sudo docker ps -a --format '{{.Names}}' | grep '^et-pulse' | xargs -r sudo docker rm -f || true

            if command -v docker-compose &>/dev/null; then
              COMPOSE="sudo docker-compose --env-file .env.local"
            else
              COMPOSE="sudo docker compose --env-file .env.local"
            fi

            $COMPOSE down --remove-orphans 2>/dev/null || true
            $COMPOSE up -d --build --force-recreate --remove-orphans

            echo "✅ Deployment complete"
