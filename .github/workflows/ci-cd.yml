name: ET-Pulse Deploy

on:
  push:
    branches:
      - main

concurrency:
  group: deploy-main
  cancel-in-progress: true

jobs:
  deploy-to-server:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.KEY }}
          port: ${{ secrets.PORT }}
          script: |
            set -euo pipefail

            # Project path on the remote host.
            APP_DIR="/home/${{ secrets.USERNAME }}/et-pulse"
            cd "$APP_DIR"

            # Ensure compose can read runtime variables from the project root.
            if [ ! -f .env.local ]; then
              echo ".env.local is missing in $APP_DIR"
              exit 1
            fi

            # Sync project code from main before restarting services.
            git fetch origin main
            git checkout main
            git pull --ff-only origin main

            # Stop existing stack and clean up orphaned containers.
            docker compose down --remove-orphans

            # Start cleanly and recreate containers to avoid stale conflicts.
            docker compose up -d --force-recreate --remove-orphans