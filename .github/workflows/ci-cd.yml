name: ET-Pulse Deploy

on:
  push:
    branches:
      - main

concurrency:
  group: deploy-main
  cancel-in-progress: true

jobs:
  deploy-to-server:
    runs-on: ubuntu-latest
    env:
      DEPLOY_HOST: ${{ secrets.EC2_HOST || secrets.HOST }}
      DEPLOY_USER: ${{ secrets.EC2_USER || secrets.USERNAME }}
      DEPLOY_KEY: ${{ secrets.EC2_SSH_KEY || secrets.KEY }}
      DEPLOY_PORT: ${{ secrets.EC2_PORT || secrets.PORT || '22' }}
    steps:
      - name: Validate deploy secrets
        shell: bash
        run: |
          set -euo pipefail
          test -n "${DEPLOY_HOST}" || (echo "Missing deploy host secret (EC2_HOST or HOST)" && exit 1)
          test -n "${DEPLOY_USER}" || (echo "Missing deploy user secret (EC2_USER or USERNAME)" && exit 1)
          test -n "${DEPLOY_KEY}" || (echo "Missing deploy key secret (EC2_SSH_KEY or KEY)" && exit 1)

      - name: Deploy via SSH
        uses: appleboy/ssh-action@master
        with:
          host: ${{ env.DEPLOY_HOST }}
          username: ${{ env.DEPLOY_USER }}
          key: ${{ env.DEPLOY_KEY }}
          port: ${{ env.DEPLOY_PORT }}
          script: |
            set -uo pipefail

            # Project path on the remote host.
            APP_DIR="/home/${{ env.DEPLOY_USER }}/et-pulse"
            cd "$APP_DIR"

            # Ensure compose can read runtime variables from the project root.
            if [ ! -f .env.local ]; then
              echo ".env.local is missing in $APP_DIR"
              exit 1
            fi

            # Sync project code from main before restarting services.
            git fetch origin main
            git checkout main
            git pull --ff-only origin main

            # Step 1: Force remove by exact container name (most reliable)
            sudo docker rm -f et-pulse-intelligence et-pulse-news et-pulse-web-gateway et-pulse-nginx 2>/dev/null || true

            # Step 2: Also remove by any name starting with et-pulse- (catches renamed ones)
            sudo docker ps -a --format '{{.Names}}' | grep '^et-pulse-' | xargs -r sudo docker rm -f || true

            if command -v docker-compose >/dev/null 2>&1; then
              COMPOSE_CMD="sudo docker-compose --env-file .env.local"
            else
              COMPOSE_CMD="sudo docker compose --env-file .env.local"
            fi

            # Step 3: Now run compose down for cleanup
            $COMPOSE_CMD down --remove-orphans 2>/dev/null || true

            # Fail fast for the actual deploy action only.
            set -e

            # Step 4: Start fresh
            $COMPOSE_CMD up -d --build --force-recreate --remove-orphans